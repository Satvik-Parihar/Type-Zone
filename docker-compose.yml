version: '3.9'

services:
  server:
    build:
      context: ./server
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=typezone
      - JWT_SECRET=change_me
      - CLIENT_ORIGIN=http://localhost:5173
    depends_on:
      - mongo

  client:
    build:
      context: ./client
    ports:
      - '8080:80'
    depends_on:
      - server

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
