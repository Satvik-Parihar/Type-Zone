<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Dark background -->
  <rect width="192" height="192" fill="#070B1A"/>
  
  <!-- Accent glow circle -->
  <circle cx="96" cy="96" r="88" fill="none" stroke="#5CE1E6" stroke-width="2" opacity="0.3"/>
  
  <!-- TZ monogram in accent color -->
  <text x="96" y="110" font-family="JetBrains Mono, monospace" font-size="72" font-weight="bold" fill="#5CE1E6" text-anchor="middle" dominant-baseline="middle">
    TZ
  </text>
  
  <!-- Keyboard key indicator beneath -->
  <rect x="60" y="135" width="16" height="14" rx="2" fill="none" stroke="#5CE1E6" stroke-width="1.5" opacity="0.6"/>
  <rect x="80" y="135" width="16" height="14" rx="2" fill="none" stroke="#5CE1E6" stroke-width="1.5" opacity="0.6"/>
  <rect x="100" y="135" width="16" height="14" rx="2" fill="none" stroke="#5CE1E6" stroke-width="1.5" opacity="0.6"/>
  <rect x="120" y="135" width="16" height="14" rx="2" fill="none" stroke="#5CE1E6" stroke-width="1.5" opacity="0.6"/>
</svg>
