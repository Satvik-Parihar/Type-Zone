<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #070B1A; }
        .text { fill: #5CE1E6; }
        .glow { stroke: #5CE1E6; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #F5F5F7; }
        .text { fill: #0066CC; }
        .glow { stroke: #0066CC; }
      }
    </style>
    <radialGradient id="fadeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#5CE1E6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#5CE1E6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" class="bg"/>
  
  <!-- Outer glow -->
  <circle cx="96" cy="96" r="85" fill="url(#fadeGlow)"/>
  
  <!-- Accent circle border -->
  <circle cx="96" cy="96" r="85" fill="none" class="glow" stroke-width="2" opacity="0.4"/>
  
  <!-- Center monogram -->
  <text x="96" y="115" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="68" font-weight="900" class="text" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">
    TZ
  </text>
  
  <!-- Keyboard indicator line (three keys suggesting typing) -->
  <g class="glow" stroke-width="1.5" opacity="0.7" fill="none">
    <rect x="56" y="138" width="14" height="12" rx="1.5"/>
    <rect x="76" y="138" width="14" height="12" rx="1.5"/>
    <rect x="96" y="138" width="14" height="12" rx="1.5"/>
    <rect x="116" y="138" width="14" height="12" rx="1.5"/>
  </g>
  
  <!-- Subtle accent dot for visual balance -->
  <circle cx="155" cy="45" r="3" class="text" opacity="0.6"/>
</svg>
