<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="48" height="48" rx="8" fill="#0B1220"/>
  
  <!-- Keyboard symbol simplified -->
  <g stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main keyboard outline -->
    <rect x="6" y="14" width="36" height="20" rx="2"/>
    
    <!-- Keys top row -->
    <line x1="10" y1="18" x2="10" y2="22"/>
    <line x1="16" y1="18" x2="16" y2="22"/>
    <line x1="22" y1="18" x2="22" y2="22"/>
    <line x1="28" y1="18" x2="28" y2="22"/>
    <line x1="34" y1="18" x2="34" y2="22"/>
    
    <!-- Keys bottom row -->
    <line x1="10" y1="26" x2="10" y2="30"/>
    <line x1="16" y1="26" x2="16" y2="30"/>
    <rect x="21" y="26" width="6" height="4" rx="1" fill="#38BDF8"/>
    <line x1="28" y1="26" x2="28" y2="30"/>
    <line x1="34" y1="26" x2="34" y2="30"/>
  </g>
  
  <!-- Accent glow -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
</svg>